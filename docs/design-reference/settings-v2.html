<style>
#photo-app-simple-settings{--pa-bg:light-dark(#fff,#1b1d22);--pa-canvas:light-dark(#f6f7f9,#121419);--pa-text:light-dark(#292d36,#eceef4);--pa-sub:light-dark(#69717e,#b5bcc9);--pa-line:light-dark(#e7e9ee,#373c46);--pa-soft:light-dark(#f0f2f6,#292e38);--pa-accent:light-dark(#4967c7,#adc0ff);--pa-on:light-dark(#fff,#182650);--pa-danger:light-dark(#a14943,#f0b2aa);--pa-radius:16px;font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:var(--pa-text);width:100%}
#photo-app-simple-settings *{box-sizing:border-box}
#photo-app-simple-settings button,#photo-app-simple-settings select{font:inherit;cursor:inherit;touch-action:manipulation}
#photo-app-simple-settings button{color:inherit}
#photo-app-simple-settings button:focus-visible,#photo-app-simple-settings input:focus-visible{outline:3px solid var(--pa-accent);outline-offset:3px}
#photo-app-simple-settings button:active{filter:brightness(.94)}
#photo-app-simple-settings .pa-preview-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 16px;padding-right:68px}
#photo-app-simple-settings .pa-preview-nav button{border:0;background:var(--pa-canvas);padding:10px 13px;border-radius:8px;font-size:13px;min-height:40px}
#photo-app-simple-settings .pa-preview-nav button[aria-pressed=true]{background:var(--pa-soft);color:var(--pa-accent);box-shadow:inset 0 -2px var(--pa-accent)}
#photo-app-simple-settings .pa-stage{padding:20px 8px;display:flex;justify-content:center;border-radius:20px}
#photo-app-simple-settings .pa-phone{position:relative;width:min(100%,390px);background:var(--pa-bg);border:1px solid var(--pa-line);border-radius:28px;box-shadow:0 10px 40px #202b4010;overflow:hidden;font-size:14px;line-height:1.5}
#photo-app-simple-settings .pa-status{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:500}
#photo-app-simple-settings .pa-status-right{display:flex;gap:6px;align-items:center}
#photo-app-simple-settings .pa-status-right svg{width:14px;height:14px}
#photo-app-simple-settings .pa-app{min-height:700px;display:flex;flex-direction:column;position:relative}
#photo-app-simple-settings .pa-header{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 4px;gap:8px}
#photo-app-simple-settings .pa-header h2{font-size:26px;line-height:1.3;font-weight:500;margin:0;letter-spacing:.02em}
#photo-app-simple-settings .pa-header-group{display:flex;gap:8px;align-items:center}
#photo-app-simple-settings .pa-icon{display:inline-flex;justify-content:center;align-items:center;border:0;background:transparent;min-width:48px;min-height:48px;border-radius:12px;padding:10px}
#photo-app-simple-settings .pa-icon svg{width:21px;height:21px;stroke-width:1.7}
#photo-app-simple-settings .pa-text-button{border:0;background:transparent;padding:12px 8px;min-height:48px;font-size:14px;color:var(--pa-sub);border-radius:10px}
#photo-app-simple-settings .pa-caption{font-size:13px;color:var(--pa-sub);margin:2px 20px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
#photo-app-simple-settings .pa-caption strong{color:var(--pa-text);font-weight:500}
#photo-app-simple-settings .pa-progress{height:3px;background:var(--pa-soft);margin:0 20px 18px;border-radius:2px;overflow:hidden}
#photo-app-simple-settings .pa-progress div{height:100%;background:var(--pa-accent);border-radius:2px;transition:width .18s ease}
#photo-app-simple-settings .pa-photo-frame{background:var(--pa-canvas);margin:0 20px;border-radius:var(--pa-radius);overflow:hidden;position:relative;aspect-ratio:1.04;display:flex;align-items:center;justify-content:center}
#photo-app-simple-settings .pa-photo-frame img{display:block;width:100%;height:100%;object-fit:contain}
#photo-app-simple-settings .pa-photo-frame button{position:absolute;right:8px;bottom:8px;background:var(--pa-bg);min-width:48px;min-height:48px;opacity:.95}
#photo-app-simple-settings .pa-photo-info{display:flex;justify-content:space-between;gap:8px;margin:11px 20px 12px;color:var(--pa-sub);font-size:12px}
#photo-app-simple-settings .pa-album-head{margin:0 20px;display:flex;justify-content:space-between;align-items:center}
#photo-app-simple-settings .pa-album-head p{font-weight:500;margin:0}
#photo-app-simple-settings .pa-album-head button{font-size:12px}
#photo-app-simple-settings .pa-destinations{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 14px}
#photo-app-simple-settings .pa-destination{border:1px solid var(--pa-line);border-radius:12px;min-height:52px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:var(--pa-bg);text-align:left}
#photo-app-simple-settings .pa-destination svg{color:var(--pa-accent);width:19px;height:19px;stroke-width:1.6}
#photo-app-simple-settings .pa-destination[aria-pressed=true]{background:var(--pa-soft);border-color:var(--pa-accent)}
#photo-app-simple-settings .pa-destination:disabled{opacity:.5}
#photo-app-simple-settings .pa-footer{margin-top:auto;padding:10px 20px 4px;background:var(--pa-bg)}
#photo-app-simple-settings .pa-footer-actions{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#photo-app-simple-settings .pa-secondary{border:1px solid var(--pa-line);background:var(--pa-bg);border-radius:12px;min-height:50px;padding:10px 14px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:14px}
#photo-app-simple-settings .pa-secondary svg{width:18px;height:18px}
#photo-app-simple-settings .pa-primary{background:var(--pa-accent);color:var(--pa-on);border:0;border-radius:12px;min-height:50px;padding:12px 16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;font-size:14px}
#photo-app-simple-settings .pa-primary svg{width:18px;height:18px}
#photo-app-simple-settings .pa-primary:disabled{background:var(--pa-soft);color:var(--pa-sub)}
#photo-app-simple-settings .pa-footnote{font-size:11px;color:var(--pa-sub);text-align:center;margin:0;padding:0 0 10px}
#photo-app-simple-settings .pa-homebar{height:20px;display:flex;justify-content:center;align-items:center;background:var(--pa-bg)}
#photo-app-simple-settings .pa-homebar:after{content:"";width:100px;height:4px;background:var(--pa-text);opacity:.65;border-radius:3px}
#photo-app-simple-settings .pa-grid-tools{display:flex;justify-content:space-between;align-items:center;margin:0 20px 8px;font-size:13px;gap:8px}
#photo-app-simple-settings .pa-grid-tools button{color:var(--pa-accent)}
#photo-app-simple-settings .pa-photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:0 20px 16px}
#photo-app-simple-settings .pa-thumb{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--pa-canvas);border-radius:7px;overflow:hidden}
#photo-app-simple-settings .pa-thumb img{width:100%;height:100%;object-fit:cover;display:block}
#photo-app-simple-settings .pa-tick{position:absolute;right:6px;top:6px;width:21px;height:21px;border:1.5px solid #fff;background:#252c3835;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff}
#photo-app-simple-settings .pa-tick svg{width:14px;height:14px;stroke-width:2.5}
#photo-app-simple-settings .pa-thumb[aria-pressed=true] .pa-tick{background:var(--pa-accent);color:var(--pa-on);border-color:var(--pa-accent)}
#photo-app-simple-settings .pa-thumb[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--pa-accent)}
#photo-app-simple-settings .pa-thumb[aria-pressed=true] img{opacity:.78}
#photo-app-simple-settings .pa-tag{position:absolute;bottom:4px;left:4px;font-size:11px;border-radius:4px;padding:2px 6px;background:var(--pa-bg);color:var(--pa-accent)}
#photo-app-simple-settings .pa-inline-note{display:flex;align-items:center;gap:8px;padding:11px 12px;margin:0 20px 12px;border-radius:10px;background:var(--pa-soft);font-size:12px;color:var(--pa-accent)}
#photo-app-simple-settings .pa-inline-note svg{width:16px;height:16px;flex:none}
#photo-app-simple-settings .pa-sheet-backdrop{position:absolute;inset:0;background:#17213344;z-index:10;display:flex;align-items:flex-end;border-radius:0 0 28px 28px}
#photo-app-simple-settings .pa-sheet{width:100%;padding:8px 20px 16px;border-radius:24px 24px 0 0;background:var(--pa-bg);box-shadow:0 -8px 32px #17213318}
#photo-app-simple-settings .pa-handle{width:32px;height:4px;border-radius:3px;background:var(--pa-line);margin:0 auto 8px}
#photo-app-simple-settings .pa-sheet-head{display:flex;align-items:center;justify-content:space-between}
#photo-app-simple-settings .pa-sheet h3{font-size:20px;font-weight:500;margin:0}
#photo-app-simple-settings .pa-sheet-desc{font-size:13px;color:var(--pa-sub);margin:0 0 16px}
#photo-app-simple-settings .pa-move-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--pa-line)}
#photo-app-simple-settings .pa-move-row img{width:46px;height:46px;object-fit:cover;border-radius:8px}
#photo-app-simple-settings .pa-move-row>div{flex:1;min-width:0}
#photo-app-simple-settings .pa-move-row strong{display:block;font-weight:500;font-size:14px}
#photo-app-simple-settings .pa-move-row small{display:block;font-size:11px;color:var(--pa-sub);overflow-wrap:anywhere}
#photo-app-simple-settings .pa-summary{font-size:13px;color:var(--pa-sub);padding:16px 0;margin:0}
#photo-app-simple-settings .pa-sheet-actions{display:flex;gap:10px}
#photo-app-simple-settings .pa-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:38px 24px;flex:1}
#photo-app-simple-settings .pa-complete-mark{width:68px;height:68px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pa-soft);color:var(--pa-accent);margin-bottom:8px}
#photo-app-simple-settings .pa-complete-mark svg{width:30px;height:30px;stroke-width:1.5}
#photo-app-simple-settings .pa-empty h3{font-size:24px;margin:0;font-weight:500}
#photo-app-simple-settings .pa-empty p{font-size:14px;color:var(--pa-sub);margin:0;max-width:260px}
#photo-app-simple-settings .pa-empty .pa-primary{flex:none;width:100%;margin-top:20px}
#photo-app-simple-settings .pa-segment{display:flex;align-items:center;gap:24px;margin:8px 20px 20px;border-bottom:1px solid var(--pa-line)}
#photo-app-simple-settings .pa-segment button{border:0;background:transparent;font-size:15px;min-height:48px;padding:0 2px 12px;color:var(--pa-sub)}
#photo-app-simple-settings .pa-segment button[aria-pressed=true]{color:var(--pa-accent);box-shadow:inset 0 -2px var(--pa-accent)}
#photo-app-simple-settings .pa-library-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;margin:0 20px 24px}
#photo-app-simple-settings .pa-album{border:0;background:transparent;text-align:left;padding:0;min-width:0}
#photo-app-simple-settings .pa-cover{width:100%;aspect-ratio:1.12;object-fit:cover;border-radius:var(--pa-radius);display:block;background:var(--pa-canvas);margin-bottom:9px}
#photo-app-simple-settings .pa-album-label{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:15px}
#photo-app-simple-settings .pa-album-label small{font-size:12px;color:var(--pa-sub)}
#photo-app-simple-settings .pa-library-nav{margin-top:auto;border-top:1px solid var(--pa-line);display:grid;grid-template-columns:1fr 1fr;padding:5px 36px 0}
#photo-app-simple-settings .pa-library-nav button{min-height:62px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--pa-sub);font-size:11px;padding:8px}
#photo-app-simple-settings .pa-library-nav svg{width:22px;height:22px;stroke-width:1.7}
#photo-app-simple-settings .pa-library-nav button[aria-pressed=true]{color:var(--pa-accent)}
#photo-app-simple-settings .pa-toast{margin:0 20px 12px;background:var(--pa-soft);color:var(--pa-accent);border-radius:10px;padding:10px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#photo-app-simple-settings .pa-toast button{font-size:12px;border:0;background:transparent;min-height:36px;color:inherit;padding:0 4px}
#photo-app-simple-settings .pa-section-title{margin:18px 20px 8px;font-size:12px;color:var(--pa-sub)}
#photo-app-simple-settings .pa-setting-row{display:flex;align-items:center;gap:12px;margin:0 20px;padding:14px 0;border-bottom:1px solid var(--pa-line);min-height:64px}
#photo-app-simple-settings .pa-setting-row>div{flex:1;min-width:0}
#photo-app-simple-settings .pa-setting-row strong{display:block;font-size:14px;font-weight:400}
#photo-app-simple-settings .pa-setting-row small{display:block;font-size:12px;color:var(--pa-sub);margin-top:3px}
#photo-app-simple-settings .pa-setting-row button{font-size:13px;color:var(--pa-accent);flex-shrink:0}
#photo-app-simple-settings .pa-setting-row input{accent-color:var(--pa-accent);width:20px;height:20px;margin:10px}
#photo-app-simple-settings .pa-setting-footer{margin:28px 20px;color:var(--pa-sub);font-size:12px}
#photo-app-simple-settings .pa-viewer{background:#111318;color:#f2f3f6;flex:1;display:flex;flex-direction:column;min-height:700px}
#photo-app-simple-settings .pa-viewer .pa-text-button{color:#c6cbd6}
#photo-app-simple-settings .pa-viewer-image{width:100%;aspect-ratio:1;object-fit:contain;margin:auto 0}
#photo-app-simple-settings .pa-viewer-tools{display:flex;justify-content:space-evenly;padding:16px 8px;gap:6px}
#photo-app-simple-settings .pa-viewer-tools button{min-width:64px;display:flex;flex-direction:column;gap:6px;font-size:12px}
#photo-app-simple-settings .pa-viewer-tools svg{width:22px;height:22px}
#photo-app-simple-settings .pa-grid-scroll{height:350px;min-height:180px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--pa-line) transparent}
#photo-app-simple-settings .pa-grid-scroll .pa-grid-tools{margin-bottom:4px}
#photo-app-simple-settings .pa-grid-scroll .pa-photo-grid{margin-bottom:8px}
#photo-app-simple-settings .pa-grid-scroll .pa-thumb{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#photo-app-simple-settings .pa-grid-scroll img{pointer-events:none;user-select:none;-webkit-user-drag:none}
#photo-app-simple-settings .pa-grid-scroll.is-selecting{cursor:crosshair;user-select:none}
#photo-app-simple-settings .pa-grid-scroll.is-selecting .pa-thumb{filter:none}
#photo-app-simple-settings .pa-grid-scroll .pa-thumb[aria-pressed=true]::after{content:"";position:absolute;inset:0;border:3px solid var(--pa-accent);border-radius:7px;pointer-events:none}
#photo-app-simple-settings .pa-grid-dock{padding-top:4px;border-top:1px solid var(--pa-line);background:var(--pa-bg);margin-top:auto}
#photo-app-simple-settings .pa-grid-dock .pa-destinations{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-bottom:4px}
#photo-app-simple-settings .pa-grid-dock .pa-destination{min-height:48px;padding:8px 3px;justify-content:center;gap:0;font-size:13px}
#photo-app-simple-settings .pa-grid-dock .pa-destination svg{display:none}
#photo-app-simple-settings .pa-grid-dock .pa-footer{padding-top:8px}
#photo-app-simple-settings .pa-grid-selection-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 20px;min-height:48px}
#photo-app-simple-settings .pa-grid-selection-bar span{font-size:13px}
#photo-app-simple-settings .pa-grid-hint{margin:0 20px 8px;font-size:12px;line-height:1.5;color:var(--pa-sub);min-height:36px}
#photo-app-simple-settings .pa-grid-hint.is-active{color:var(--pa-accent)}
#photo-app-simple-settings .pa-selection-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#photo-app-simple-settings .pa-settings-list{margin:16px 20px 0}
#photo-app-simple-settings .pa-settings-action{width:100%;margin:0;border:0;border-bottom:1px solid var(--pa-line);background:var(--pa-bg);text-align:left;min-height:76px;padding:16px 0}
#photo-app-simple-settings .pa-settings-action>svg{width:18px;height:18px;color:var(--pa-sub);flex:none}
#photo-app-simple-settings .pa-settings-brand{margin:auto 20px 24px;text-align:center;color:var(--pa-sub);font-size:12px;padding-top:32px}
@media(max-width:360px){#photo-app-simple-settings .pa-stage{padding:12px 0}#photo-app-simple-settings .pa-preview-nav{padding-right:0;gap:5px}#photo-app-simple-settings .pa-preview-nav button{padding:9px 10px}#photo-app-simple-settings .pa-phone{border-radius:20px}#photo-app-simple-settings .pa-header h2{font-size:24px}#photo-app-simple-settings .pa-header,#photo-app-simple-settings .pa-footer{padding-left:16px;padding-right:16px}#photo-app-simple-settings .pa-destinations{padding-left:16px;padding-right:16px}}
@media(prefers-reduced-motion:reduce){#photo-app-simple-settings *{transition:none!important}}
</style>
<div id="photo-app-simple-settings">
  <nav class="pa-preview-nav" aria-label="设计预览页面">
    <button type="button" class="cursor-interaction" data-preview="single" aria-pressed="true">单张分类</button>
    <button type="button" class="cursor-interaction" data-preview="grid" aria-pressed="false">网格多选</button>
    <button type="button" class="cursor-interaction" data-preview="confirm" aria-pressed="false">提交确认</button>
    <button type="button" class="cursor-interaction" data-preview="library" aria-pressed="false">相册浏览</button>
    <button type="button" class="cursor-interaction" data-preview="settings" aria-pressed="false">设置</button>
  </nav>
  <div class="pa-stage viz-dotted-background">
    <div class="pa-phone" aria-label="照片整理 App 浅色界面方案">
      <div class="pa-status"><span>9:41</span><div class="pa-status-right"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></div></div>
      <div class="pa-app" id="pa-screen"></div>
      <div class="pa-homebar" aria-hidden="true"></div>
    </div>
  </div>
</div>
<script>
(() => {
 const root=document.getElementById('photo-app-simple-settings');
 const screen=root.querySelector('#pa-screen');
 const base='https://cdn.jsdelivr.net/gh/ianare/exif-samples@master/jpg/gps/';
 const sampleNames=['DSCN0010','DSCN0012','DSCN0021','DSCN0040','DSCN0042','DSCN0010'];
 const sampleLabels=['庭院远景','林间空地','公园步道','石砌教堂','城市街角','庭院留影'];
 const photos=Array.from({length:36},(_,i)=>({id:i,src:base+sampleNames[i%6]+'.jpg',alt:sampleLabels[i%6],date:['今天','昨天','10 月 31 日'][Math.floor(i/12)]}));
 const albums=[{name:'旅行',path:'Pictures/旅行/',count:128,cover:0},{name:'家人',path:'Pictures/家人/',count:86,cover:1},{name:'工作',path:'Pictures/工作/',count:42,cover:2},{name:'生活',path:'Pictures/生活/',count:215,cover:4}];
 const state={view:'settings',assign:{},done:[],selected:[],history:[],modal:null,toast:'',libraryTab:'albums',currentAlbum:null,currentPhoto:0,busy:false,failed:[],pendingTrash:[],lastCommit:null,targets:['旅行','家人','工作','生活']};
 const design={accent:'#4967c7',radius:16};
 const saved=window.openai?.widgetState?.privateContent;
 if(saved?.palette==='blue-neutral'&&saved?.design){if(/^#[0-9a-f]{6}$/i.test(saved.design.accent))design.accent=saved.design.accent;if(Number.isFinite(saved.design.radius))design.radius=Math.max(0,Math.min(24,saved.design.radius));}
 const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const btn=(label,action,cls='pa-text-button',extra='')=>`<button type="button" class="${cls} cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
 const image=(p,cls='')=>`<img src="${p.src}" alt="${p.alt}（示例照片）" class="${cls}" decoding="async">`;
 const pending=()=>Object.keys(state.assign).filter(k=>!state.done.includes(Number(k)));
 const remaining=()=>photos.filter(p=>!state.done.includes(p.id)&&!state.pendingTrash.includes(p.id)&&state.assign[p.id]===undefined);
 const persist=()=>window.openai?.setWidgetState?.({modelContent:{design:'白灰蓝，设置仅保留归档相册与照片权限',preview:state.view},privateContent:{design,palette:'blue-neutral'}})?.catch(()=>{});
 const notify=(text)=>{state.toast=text;};
 const header=(title,right='',back=false)=>`<header class="pa-header"><div class="pa-header-group">${back?btn(icon('arrow-left'),'back','pa-icon','aria-label="返回"'):''}<h2>${title}</h2></div><div class="pa-header-group">${right}</div></header>`;
 function destinationButtons(ids){return `<div class="pa-destinations">${albums.map(a=>btn(`${icon('folder')}<span>${a.name}</span>`,'assign:'+a.name,'pa-destination',ids.length?'':'disabled')).join('')}</div>`;}
 function toast(){return state.toast?`<div class="pa-toast" role="status"><span>${state.toast}</span>${state.lastCommit?btn('撤销移动','undo-move'):''}</div>`:'';}
 function footer(){const count=pending().length+state.pendingTrash.length;return `<footer class="pa-footer"><div class="pa-footer-actions">${btn(icon('undo-2'),'undo','pa-secondary','aria-label="撤销上次分类" '+(state.history.length?'':'disabled'))}${btn(`提交已选照片${count?' · '+count:''}`,'submit','pa-primary',count?'':'disabled')}</div><p class="pa-footnote">选择相册后先保存决定，提交时移动照片</p></footer>`;}
 function gridInbox(){
 const available=photos.filter(p=>!state.done.includes(p.id));
 const allSelected=available.length>0&&available.every(p=>state.selected.includes(p.id));
 let html=header('收件箱',`${btn(icon('rectangle-vertical'),'toggle-view','pa-icon','aria-label="切换单张"')}${btn(icon('ellipsis'),'menu','pa-icon','aria-label="整理选项"')}`);

 case 'select':{const id=Number(arg);state.selected=state.selected.includes(id)?state.selected.filter(i=>i!==id):[...state.selected,id];break;}
 case 'select-all':{const ids=photos.filter(p=>!state.done.includes(p.id)).map(p=>p.id);state.selected=ids.every(id=>state.selected.includes(id))?[]:ids;break;}
 case 'select-day':{const ids=photos.filter(p=>p.date===arg&&!state.done.includes(p.id)).map(p=>p.id);const all=ids.every(id=>state.selected.includes(id));state.selected=all?state.selected.filter(id=>!ids.includes(id)):[...new Set([...state.selected,...ids])];break;}
 case 'all-albums':state.modal='albums';break;
 case 'choose':if(state.modal==='change'){state.modal=null;info('调整相册',`将当前照片移动至「${arg}」。正式版本会按系统授权执行。`);}else{state.modal=null;assign(arg);}break;
 case 'undo':{const last=state.history.pop();if(last){state.assign=last.assign;state.pendingTrash=last.trash;notify('已撤销上次分类');}break;}
 case 'submit':if(pending().length+state.pendingTrash.length)state.modal='confirm';break;
 case 'commit':{if(state.busy)return;state.busy=true;render();await new Promise(r=>setTimeout(r,450));const ids=[...pending().map(Number),...state.pendingTrash];state.lastCommit={done:[...state.done],assign:{...state.assign},trash:[...state.pendingTrash],ids};state.done=[...new Set([...state.done,...ids])];state.pendingTrash=[];state.selected=[];state.history=[];state.busy=false;state.modal=null;state.toast=`${ids.length} 张处理完成`;if(state.done.length===photos.length)state.view='complete';break;}
 case 'undo-move':if(state.lastCommit){state.done=state.lastCommit.done;state.assign={};state.pendingTrash=[];state.lastCommit=null;state.view='grid';state.currentAlbum=null;notify('已撤销本批移动（演示）');}break;
 case 'menu':state.modal='menu';break;
 case 'pause':state.modal='pause';break;
 case 'close-modal':state.modal=null;break;
 case 'settings':state.returnView=state.view;state.modal=null;state.view='settings';break;
 case 'organize':state.modal='organize';break;
 case 'manage-targets':state.modal='targets';break;
 case 'browse':state.view='library';state.toast='';break;
 case 'tab':state.libraryTab=arg;state.currentAlbum=null;state.toast='';break;
 case 'album-filter':state.onlyTargets=arg==='targets';break;
 case 'album':state.currentAlbum=arg;break;
 case 'back':if(state.view==='viewer'){state.view=state.viewerReturn||'library';}else if(state.view==='settings'){state.view=state.returnView||'library';}else if(state.currentAlbum){state.currentAlbum=null;}else state.view='library';state.toast='';break;
 case 'zoom':state.currentPhoto=Number(arg);state.viewerReturn=state.view;state.view='viewer';state.toast='';break;
 case 'change-album':if(state.viewerReturn==='single'||state.viewerReturn==='grid'){state.view=state.viewerReturn;state.modal='albums';if(state.view==='grid')state.selected=[state.currentPhoto];}else state.modal='change';break;
 case 'trash':{const ids=state.view==='grid'?state.selected:[remaining()[0]?.id];state.trashIds=ids.filter(x=>x!==undefined);if(!state.trashIds.length){state.modal=null;notify('请先选择照片');}else state.modal='trash';break;}
 case 'confirm-trash':state.history.push({assign:{...state.assign},trash:[...state.pendingTrash]});state.trashIds.forEach(id=>{delete state.assign[id];});state.pendingTrash=[...new Set([...state.pendingTrash,...state.trashIds])];state.selected=[];state.modal=null;notify(`${state.trashIds.length} 张待移入回收站`);break;
 case 'viewer-trash':info('移入系统回收站','正式版本会请求系统确认，成功后更新照片列表。');break;
 case 'share':info('分享照片','正式版本打开 Android 系统分享面板。');break;
 case 'photo-info':info('照片信息','今天 14:32 · 来自相机 · 此处使用示例照片');break;
 case 'history':info('历史照片整理','按日期或已有相册选择旧照片，加入一次独立的整理会话。');break;
 case 'records':state.modal='records';break;
 case 'record-undo':info('撤销归档','正式版本会尝试将这批照片移回原相册，并按需请求系统授权。');break;
 case 'permission':info('照片访问权限','正式版本进入系统权限管理。仅允许部分图片时，会明确提示检测范围受限。');break;
 }
 render();persist();
 });
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();}if(e.key==='Tab'&&state.modal){const f=[...screen.querySelectorAll('.pa-sheet button:not(:disabled),.pa-sheet input')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.pa-phone'),onChange:()=>{render();persist();}});tweak.addColorPicker(design,'accent',{label:'强调色',reference:'--pa-accent'});tweak.addSlider(design,'radius',{label:'照片圆角',min:0,max:24,unit:'px',reference:'--pa-radius'});}
})();
</script>
